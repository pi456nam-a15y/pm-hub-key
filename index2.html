<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM HUB - Key System</title>
    <link href="https://fonts.googleapis.com/css2?family=Gotham:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gotham', sans-serif;
        }

        body {
            background-color: #121216;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 340px;
            background-color: #1e1e23;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            background: #7800f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .desc {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .timer-box {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
            background: #151514;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3c3c46;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:disabled {
            background-color: #333 !important;
            color: #777;
            cursor: not-allowed;
        }

        .key-display {
            margin-top: 15px;
            padding: 10px;
            background: #151520;
            border-radius: 8px;
            border: 1px dashed #7800f0;
            word-break: break-all;
            font-size: 14px;
            display: none;
        }

        .copy-btn {
            margin-top: 10px;
            background-color: #28a745;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="logo">PM</div>
        <h2>PM HUB - GET KEY</h2>
        <p class="desc" id="statusText">กรุณารอสักครู่เพื่อให้ระบบสร้างคีย์...</p>
        
        <div class="timer-box" id="timer">30</div>

        <button class="btn" id="actionBtn" disabled>กำลังทำภารกิจ...</button>
        
        <div class="key-display" id="keyDisplay"></div>
        <button class="btn copy-btn" id="copyBtn" onclick="copyKey()">คัดลอกคีย์</button>
    </div>

    <script>
        let timeLeft = 30;
        const timerElement = document.getElementById("timer");
        const actionBtn = document.getElementById("actionBtn");
        const statusText = document.getElementById("statusText");
        const keyDisplay = document.getElementById("keyDisplay");
        const copyBtn = document.getElementById("copyBtn");
        const container = document.getElementById("mainContainer");

        // ระบบนับถอยหลัง
        let countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "สำเร็จ!";
                statusText.textContent = "กดปุ่มด้านล่างเพื่อรับคีย์ของคุณ";
                actionBtn.disabled = false;
                actionBtn.textContent = "รับคีย์ (GET KEY)";
                actionBtn.style.background = "linear-gradient(90deg, #7800f0, #a832ff)";
            }
        }, 1000);

        // ฟังก์ชันสุ่มสร้าง Key เมื่อกดปุ่ม
        actionBtn.addEventListener("click", () => {
            if (timeLeft <= 0) {
                const generatedKey = "PM-HUB-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-" + Math.floor(Math.random() * 8999 + 1000);
                
                keyDisplay.textContent = generatedKey;
                keyDisplay.style.display = "block";
                copyBtn.style.display = "block";
                
                actionBtn.textContent = "สร้างคีย์สำเร็จแล้ว";
                actionBtn.disabled = true;
                actionBtn.style.background = "#333";
            }
        });

        // ฟังก์ชันคัดลอกคีย์
        function copyKey() {
            const keyText = keyDisplay.textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                copyBtn.textContent = "คัดลอกสำเร็จ!";
                setTimeout(() => {
                    copyBtn.textContent = "คัดลอกคีย์";
                }, 2000);
            });
        }

        // เอฟเฟกต์ RGB กรอบเว็บไซต์ (จำลองตามโค้ด Roblox ของคุณ)
        let hue = 0;
        function updateRGB() {
            hue = (hue + 0.5) % 360;
            container.style.borderColor = `hsl(${hue}, 85%, 60%)`;
            requestAnimationFrame(updateRGB);
        }
        updateRGB();
    </script>
</body>
</html>
