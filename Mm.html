<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM HUB - Key Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0f14; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e1e23; padding: 30px; border-radius: 12px; border: 2px solid #7800f0; text-align: center; width: 340px; box-shadow: 0 0 20px rgba(120,0,240,0.3); }
        h1 { font-size: 20px; margin-bottom: 15px; color: #f0f0f0; }
        .key-box { background: #0f0f14; padding: 12px; border-radius: 8px; border: 1px solid #3c3c46; margin: 20px 0; font-size: 18px; font-weight: bold; letter-spacing: 1px; color: #00ff88; word-break: break-all; }
        button { background: linear-gradient(180deg, #7800f0, #5000a0); border: none; color: white; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .timer { font-size: 14px; color: #aaa; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>PM HUB - KEY SYSTEM</h1>
        <p class="timer" id="status">กรุณารอ 5 วินาทีก่อนรับคีย์...</p>
        <div class="key-box" id="keyDisplay">••••••••••••</div>
        <button id="copyBtn" onclick="copyKey()" disabled>รอเวลาสักครู่...</button>
    </div>

    <script>
        // กำหนดคีย์ของวัน หรือดึงคีย์จาก Backend
        const currentKey = "PM-HUB-KEY-2026"; 
        let timeLeft = 5;

        const statusEl = document.getElementById("status");
        const keyDisplay = document.getElementById("keyDisplay");
        const copyBtn = document.getElementById("copyBtn");

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                statusEl.innerText = `กรุณารอ ${timeLeft} วินาทีก่อนรับคีย์...`;
            } else {
                clearInterval(countdown);
                statusEl.innerText = "ภารกิจเสร็จสิ้น! กดคัดลอกคีย์ด้านล่าง";
                keyDisplay.innerText = currentKey;
                copyBtn.innerText = "COPY KEY";
                copyBtn.disabled = false;
            }
        }, 1000);

        function copyKey() {
            navigator.clipboard.writeText(currentKey);
            alert("คัดลอกคีย์เรียบร้อยแล้ว!");
        }
    </script>
</body>
</html>
