<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM HUB - Key System with Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Gotham:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gotham', sans-serif;
        }

        body {
            background-color: #121216;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 350px;
            background-color: #1e1e23;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 2px solid #7800f0;
            animation: rgbBorder 6s linear infinite;
        }

        .title {
            color: #f0f0f0;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .key-display {
            background-color: #0f0f14;
            border: 1px dashed #7800f0;
            padding: 10px;
            border-radius: 8px;
            color: #51cf66;
            font-size: 15px;
            word-break: break-all;
            margin-bottom: 15px;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #7800f0, #9b30ff);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #3c3c46;
        }

        #statusText {
            margin-top: 15px;
            font-size: 13px;
            color: #a0a0a0;
        }

        @keyframes rgbBorder {
            0% { border-color: rgb(255, 0, 0); }
            33% { border-color: rgb(0, 255, 0); }
            66% { border-color: rgb(0, 0, 255); }
            100% { border-color: rgb(255, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="title">PM HUB - KEY SYSTEM</h2>
        <p class="subtitle">รับคีย์ใช้งานฟรี 2 ชั่วโมง</p>
        
        <!-- ส่วนแสดงคีย์ที่สร้่างได้ -->
        <div id="keyBox" class="key-display"></div>

        <!-- ปุ่มทำภารกิจ / รับคีย์ -->
        <button id="actionBtn" onclick="startTask()">GET KEY (ทำภารกิจ)</button>
        
        <!-- ปุ่มคัดลอกคีย์ -->
        <button id="copyBtn" class="btn-secondary" style="display:none;" onclick="copyKey()">COPY KEY</button>

        <p id="statusText">กรุณากดปุ่มเพื่อเริ่มรับคีย์</p>
    </div>

    <script>
        function startTask() {
            const statusText = document.getElementById("statusText");
            const actionBtn = document.getElementById("actionBtn");

            actionBtn.disabled = true;
            statusText.style.color = "#fcc419";
            statusText.innerText = "กำลังจำลองการทำภารกิจ / รอ 5 วินาที...";

            // จำลองการรอทำภารกิจหรือดูโฆษณา (ปรับเวลาได้ตามต้องการ หรือเปลี่ยนเป็นลิงก์ Linkvertise)
            setTimeout(() => {
                generateKey();
            }, 5000);
        }

        function generateKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let randomKey = "PMHUB-";
            for (let i = 0; i < 10; i++) {
                randomKey += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // คำนวณเวลาหมดอายุ (2 ชั่วโมงจากตอนนี้)
            const expireTime = new Date().getTime() + (2 * 60 * 60 * 1000);

            // บันทึกข้อมูลคีย์และเวลาหมดอายุลงในระบบ (จำลองผ่าน localStorage หรือส่งเข้า Database)
            const keyData = {
                key: randomKey,
                expire: expireTime
            };
            
            // บันทึกเก็บไว้ตรวจสอบ
            localStorage.setItem("pm_current_key", JSON.stringify(keyData));

            // แสดงผลบนหน้าเว็บ
            document.getElementById("keyBox.style.display") = "block"; // แก้ไข syntax เล็กน้อย
            const keyBox = document.getElementById("keyBox");
            keyBox.style.display = "block";
            keyBox.innerText = randomKey;

            document.getElementById("actionBtn").style.display = "none";
            document.getElementById("copyBtn").style.display = "block";
            
            const statusText = document.getElementById("statusText");
            statusText.style.color = "#51cf66";
            statusText.innerText = "สำเร็จ! คีย์นี้มีอายุใช้งาน 2 ชั่วโมง";
        }

        function copyKey() {
            const keyText = document.getElementById("keyBox").innerText;
            navigator.clipboard.writeText(keyText);
            document.getElementById("statusText").innerText = "คัดลอกคีย์เรียบร้อยแล้ว!";
        }
    </script>
</body>
</html>
